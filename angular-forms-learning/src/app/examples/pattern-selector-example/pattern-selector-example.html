<mat-card>
  <mat-card-header>
    <mat-card-title>パターン選択とパラメータ調整</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>3つのパターンが常に表示されており、それぞれ独立して4つのパラメータ（A, B, C, D）を横並びで調整できます。ラジオボタンで使用するパターンを選択してください。</p>

    <!-- 各パターンを行ごとに表示 -->
    @for (pattern of patterns; track $index) {
    <div class="pattern-row">
      <!-- パターンカード -->
      <div class="pattern-card">
        <div class="pattern-content">
          <!-- Angular Material ラジオボタン -->
          <div class="radio-display">
            <mat-radio-group [(ngModel)]="selectedPatternIndex">
              <mat-radio-button [value]="$index">
                {{ pattern.name }}
              </mat-radio-button>
            </mat-radio-group>
          </div>

          <!-- パラメータグリッド -->
          <form [formGroup]="patternForms[$index]" class="pattern-form">
            <div class="parameters-grid">
              <!-- パラメータ A -->
              <div class="parameter-control" [formGroup]="patternForms[$index]">
                <div class="parameter-header">
                  <h4>A</h4>
                </div>
                <div class="slider-input-row">
                  <mat-slider min="0" max="100" step="1" discrete class="slider">
                    <input matSliderThumb formControlName="a">
                  </mat-slider>
                  <div class="number-input">
                    <input type="number" formControlName="a" min="0" max="100">
                  </div>
                </div>

              </div>

              <!-- パラメータ B -->
              <div class="parameter-control" [formGroup]="patternForms[$index]">
                <div class="parameter-header">
                  <h4>B</h4>
                </div>
                <div class="slider-input-row">
                  <mat-slider min="0" max="100" step="1" discrete class="slider">
                    <input matSliderThumb formControlName="b">
                  </mat-slider>
                  <div class="number-input">
                    <input type="number" formControlName="b" min="0" max="100">
                  </div>
                </div>

              </div>

              <!-- パラメータ C -->
              <div class="parameter-control" [formGroup]="patternForms[$index]">
                <div class="parameter-header">
                  <h4>C</h4>
                </div>
                <div class="slider-input-row">
                  <mat-slider min="0" max="100" step="1" discrete class="slider">
                    <input matSliderThumb formControlName="c">
                  </mat-slider>
                  <div class="number-input">
                    <input type="number" formControlName="c" min="0" max="100">
                  </div>
                </div>

              </div>

              <!-- パラメータ D -->
              <div class="parameter-control" [formGroup]="patternForms[$index]">
                <div class="parameter-header">
                  <h4>D</h4>
                </div>
                <div class="slider-input-row">
                  <mat-slider min="0" max="100" step="1" discrete class="slider">
                    <input matSliderThumb formControlName="d">
                  </mat-slider>
                  <div class="number-input">
                    <input type="number" formControlName="d" min="0" max="100">
                  </div>
                </div>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    }
  </mat-card-content>
</mat-card>
