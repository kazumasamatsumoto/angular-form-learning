<mat-card>
  <mat-card-header>
    <mat-card-title>パターン選択とパラメータ調整</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      3つのパターンが常に表示されており、それぞれ独立して4つのパラメータ（A, B, C,
      D）を横並びで調整できます。ラジオボタンで使用するパターンを選択してください。
    </p>

    <!-- 各パターンを行ごとに表示 -->
    @for (pattern of patterns; track $index) {
      <div class="pattern-row">
        <app-pattern-card
          [patternForm]="patternForms[$index]"
          [patternName]="pattern.name"
          [patternIndex]="$index"
          [selectedPatternIndex]="selectedPatternIndex"
          [onPatternSelect]="onPatternSelect"
        />
      </div>
    }
  </mat-card-content>
</mat-card>
